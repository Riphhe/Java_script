<!DOCTYPE html>
 <head>
 <title> zadanie 18 Nazar Lishka </title>
 <meta charset="utf-8">
 </head>
<body>
 <div style="color:navy;font-size:50px;">
 <script language="JavaScript">
 var a_lis=parseFloat(prompt("a=",""));
 var b_lis=parseFloat(prompt("b=",""));
 function suma_lis(a,b){
 return a+b;
 }
 function odejmowanie_lis(a,b){
    return a-b;
 }
 function mnozenie_lis(a,b){
    return a*b;
 }
 function od_kwadratu_lis(a){
    return a**2;
 }
 function reszta_dzielenia_a_prez_b_lis(a,b){
    return a%b;
 }
 document.write("suma="+suma_lis(a_lis,b_lis)+"<br>");
 document.write("odejmowanie="+odejmowanie_lis(a_lis,b_lis)+"<br>");
 document.write("możenie="+mnozenie_lis(a_lis,b_lis)+"<br>");
 document.write("kwadrat="+od_kwadratu_lis(a_lis)+"<br>"+"kwadrat="+od_kwadratu_lis(b_lis)+"<br>");
 document.write("reszta="+reszta_dzielenia_a_prez_b_lis(a_lis,b_lis)+"<br>");
</script>
</div>
</body>
</html>
